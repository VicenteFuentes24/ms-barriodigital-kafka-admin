spring.application.name=ms-kafka-admin
server.port=${SERVER_PORT:8089}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
spring.kafka.admin.auto-create=false
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.jackson.deserialization.fail-on-unknown-properties=true
app.admin-auth.username=${KAFKA_ADMIN_USERNAME:}
app.admin-auth.password=${KAFKA_ADMIN_PASSWORD:}
app.kafka-admin.writes-enabled=${KAFKA_ADMIN_WRITES_ENABLED:false}
app.kafka-admin.protected-topics=${KAFKA_ADMIN_PROTECTED_TOPICS:bd.local.smoke.v1}
app.kafka-admin.timeout-ms=${KAFKA_ADMIN_TIMEOUT_MS:5000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,kafkaCluster
